<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forecast Bust Detection & Confidence Dashboard | IMD / NWP Decision Support</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
              950: '#082f49'
            },
            radar: {
              dark: '#070d18',
              surface: '#0d1527',
              card: '#131f37',
              border: '#1e2f4f',
              accent: '#38bdf8'
            },
            risk: {
              low: '#10b981',      // Green: High confidence / low bust risk
              moderate: '#f59e0b', // Amber: Moderate
              high: '#f97316',     // Orange: High bust risk
              critical: '#ef4444'  // Red: Critical bust risk
            }
          },
          fontFamily: {
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Chart.js for High Performance Visualizations -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- FontAwesome for Meteorological & Status Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- React 18, ReactDOM, and Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #060b13;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #091120;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* Radar Pulse Animation */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 0.2; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-danger {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    /* Leaflet Dark Customizations */
    .leaflet-container {
      background: #080f1d !important;
      font-family: 'Inter', sans-serif !important;
    }
    .leaflet-popup-content-wrapper {
      background: #0f172a !important;
      color: #e2e8f0 !important;
      border: 1px solid #334155 !important;
      border-radius: 12px !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5) !important;
    }
    .leaflet-popup-tip {
      background: #0f172a !important;
      border: 1px solid #334155 !important;
    }
    .leaflet-control-zoom a {
      background: #0f172a !important;
      color: #94a3b8 !important;
      border-color: #334155 !important;
    }
    .leaflet-control-zoom a:hover {
      background: #1e293b !important;
      color: #f8fafc !important;
    }
    .leaflet-control-attribution {
      background: rgba(15, 23, 42, 0.8) !important;
      color: #64748b !important;
      font-size: 10px !important;
    }
    .leaflet-control-attribution a {
      color: #38bdf8 !important;
    }

    /* Map Tooltip */
    .custom-tooltip {
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #f8fafc;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }
    .custom-tooltip::before {
      border-top-color: #38bdf8;
    }
  </style>
</head>
<body class="antialiased selection:bg-sky-500 selection:text-white">
  <div id="root"></div>
  <script type="text/babel" src="/app.jsx"></script>
</body>
</html>
